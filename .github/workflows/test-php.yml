name: PHP Tests

on:
    push:
        branches: [trunk]
        paths:
            - '**/*.php'
            - 'tests/phpunit/**'
            - 'composer.json'
            - 'composer.lock'
            - 'phpunit.xml.dist'
            - '.wp-env.json'
            - 'package.json'
            - 'package-lock.json'
            - '.nvmrc'
            - '.github/workflows/test-php.yml'
    pull_request:
        branches: [trunk]
        paths:
            - '**/*.php'
            - 'tests/phpunit/**'
            - 'composer.json'
            - 'composer.lock'
            - 'phpunit.xml.dist'
            - '.wp-env.json'
            - 'package.json'
            - 'package-lock.json'
            - '.nvmrc'
            - '.github/workflows/test-php.yml'

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    phpunit:
        name: PHPUnit
        runs-on: ubuntu-latest
        timeout-minutes: 20

        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js (.nvmrc)
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: npm install
              run: npm ci

            - name: Install Composer dependencies
              uses: 'ramsey/composer-install@v4'

            - name: Start WordPress
              run: npm run start

            - name: Run PHPUnit
              run: npm run test:php
