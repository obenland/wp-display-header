name: E2E Tests

on:
    push:
        branches: [trunk]
        paths:
            - '**/*.php'
            - 'css/**'
            - 'tests/e2e/**'
            - 'composer.json'
            - 'composer.lock'
            - 'playwright.config.ts'
            - '.wp-env.json'
            - '.wp-env.test.json'
            - 'package.json'
            - 'package-lock.json'
            - '.nvmrc'
            - '.github/workflows/test-e2e.yml'
    pull_request:
        branches: [trunk]
        paths:
            - '**/*.php'
            - 'css/**'
            - 'tests/e2e/**'
            - 'composer.json'
            - 'composer.lock'
            - 'playwright.config.ts'
            - '.wp-env.json'
            - '.wp-env.test.json'
            - 'package.json'
            - 'package-lock.json'
            - '.nvmrc'
            - '.github/workflows/test-e2e.yml'
            - 'README.md'

concurrency:
    group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
    cancel-in-progress: true

permissions:
    contents: read

jobs:
    e2e:
        name: Playwright E2E
        runs-on: ubuntu-latest
        timeout-minutes: 30

        steps:
            - uses: actions/checkout@v7

            - name: Setup Node.js (.nvmrc)
              uses: actions/setup-node@v7
              with:
                  node-version-file: '.nvmrc'
                  cache: npm

            - name: Cache node_modules
              id: node-modules
              uses: actions/cache@v6
              with:
                  path: node_modules
                  key: ${{ runner.os }}-node-modules-${{ hashFiles('package-lock.json') }}

            - name: npm install
              if: steps.node-modules.outputs.cache-hit != 'true'
              run: npm ci

            - name: Cache Playwright browsers
              id: playwright
              uses: actions/cache@v6
              with:
                  path: ~/.cache/ms-playwright
                  key: ${{ runner.os }}-playwright-${{ hashFiles('package-lock.json') }}

            - name: Install Playwright browsers
              if: steps.playwright.outputs.cache-hit != 'true'
              run: npm run test:e2e:install

            - name: Install Playwright system dependencies
              if: steps.playwright.outputs.cache-hit == 'true'
              run: npx playwright install-deps chromium

            - name: Cache wp-env downloads
              uses: actions/cache@v6
              with:
                  # Linux places these under ~/wp-env, other platforms under
                  # ~/.wp-env. Both are listed so the step is not silently a
                  # no-op if the runner ever changes.
                  path: |
                      ~/wp-env
                      ~/.wp-env
                  key: ${{ runner.os }}-wp-env-e2e-${{ hashFiles('.wp-env.json', 'package-lock.json') }}
                  restore-keys: |
                      ${{ runner.os }}-wp-env-e2e-

            - name: Start WordPress (with twentyseventeen)
              run: npm run start

            - name: Run Playwright tests
              run: npm run test:e2e

            - name: Upload Playwright report on failure
              if: failure()
              uses: actions/upload-artifact@v7
              with:
                  name: playwright-report
                  path: playwright-report/
                  retention-days: 14
